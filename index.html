    :root {
      --primary: #2E86AB;

      --muted: #6b7280;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 10px rgba(46,134,171,0.3);
    }
    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
    }
    header .header-meta {
      font-size: 12px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .badge {
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
    }

    .layout {
      display: flex;
      max-width: 1280px;
      margin: 0 auto;
    }

    aside {
      width: 230px;
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 28px 0;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    aside .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      padding: 0 20px 14px;
    }
    .report-list { list-style: none; }
    .report-list li a {
      display: block;
      padding: 11px 20px;
      text-decoration: none;
      color: var(--text);
      border-left: 3px solid transparent;
      transition: all 0.12s;
    }
    .report-list li a:hover { background: var(--primary-light); color: var(--primary); }
    .report-list li a.active {
      border-left-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .report-list li a .r-date { display: block; font-size: 13px; font-weight: 600; }
    .report-list li a .r-label { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .report-list li a.active .r-label { color: var(--primary); opacity: 0.8; }

    main { flex: 1; padding: 40px 52px; min-width: 0; }

    .meta-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .meta-tag {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .meta-tag.latest {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    .content h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .content h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 32px 0 14px;
      padding: 9px 14px;
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
      border-radius: 0 6px 6px 0;
    }
    .content h3 { font-size: 14px; font-weight: 600; color: var(--primary-dark); margin: 20px 0 8px; }
    .content p { font-size: 14.5px; line-height: 1.85; color: #374151; margin-bottom: 12px; }
    .content ul, .content ol { padding-left: 22px; margin-bottom: 14px; }
    .content li { font-size: 14.5px; line-height: 1.85; color: #374151; margin-bottom: 5px; }
    .content strong { color: var(--text); }
    .content em { color: var(--muted); font-size: 13px; }
    .content a { color: var(--primary); text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    .content blockquote {
      border-left: 4px solid var(--primary);
      margin: 16px 0;
      padding: 12px 20px;
      background: var(--primary-light);
      color: var(--muted);
      font-size: 13.5px;
      border-radius: 0 6px 6px 0;
    }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px;
      font-size: 13.5px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .content th {
      background: var(--primary);
      color: white;
      padding: 11px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
    }
    .content td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .content tr:last-child td { border-bottom: none; }
    .content tr:nth-child(even) td { background: #f8fbfd; }
    .content code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SF Mono", Consolas, monospace;
    }

    @media (max-width: 768px) {
      aside { display: none; }
      main { padding: 24px 18px; }
      header { padding: 0 16px; }
      header .header-meta { display: none; }
    }
  </style>
</head>

tures、Bain Capital Ventures 領投；李飛飛、Andrej Karpathy 參與 | 1 億美元 | 2026 年 2 月 |\n| Listen Labs | B 輪融資，Ribbit Capital 領投 | 6,900 萬美元 | 2026 年 1 月 |\n| Aaru | A 輪融資（多層次定價），Redpoint Ventures 領投；Accenture Ventures 跟投 | 5,000 萬美元+（估值 10 億美元） | 2025 年 12 月 |\n\n> **本週（6/5–6/12）無新融資公告。** 上表為 2026 年 Q1–Q2 已確認的重要融資事件，作為背景參考。\n\n---\n\n## 產品更新\n\n**Vurvey Labs — Populations 2.0（2026 年 6 月 3 日）**\n正式推出 Populations 平台，以 People Model™ 為核心，讓企業可針對不同人口群體進行動態情境模擬，觀察群體間如何相互影響。目前已在金融、醫療、消費品產業部署企業客戶。[（來源：Vurvey）](https://vurvey.com/solutions/populations)\n\n**Panoplai — 數位分身驗證框架白皮書（2026 年 1 月 8 日）**\n發布獨立撰寫的白皮書，為市調產業建立首套標準化的數位分身驗證框架（Validation Framework），直接回應市場對合成資料可信度的疑慮，提出準確性、治理、信賴評估的共同標準。[（來源：Yahoo Finance / NewsFileCorp）](https://finance.yahoo.com/news/panoplai-releases-independent-white-paper-165100789.html)\n\n**Fairgen — 品類專屬數位分身**\nFairgen 已從早期的合成樣本擴充（Synthetic Sample Augmentation）轉型，聚焦於建構品類導向（category-specific）的數位分身，協助品牌更快速測試概念、廣告與產品。具體產品更新時間點未見近期官方公告。\n\n**Listen Labs — 多模態情緒分析**\n平台現整合多模態情緒分析（Multimodal Emotional Analysis），能從語音語調、表情等非文字訊號中捕捉受訪者真實情感，不再局限於逐字稿分析。\n\n---\n\n## APAC 焦點\n\n**市場規模：高速成長但仍以基礎建設應用為主**\n亞太地區（APAC）數位分身市場 2025 年達 67 億美元，預計 2026 年成長至 95.7 億美元，年複合成長率（CAGR）達 44.1%，為全球最高成長區域。然而，目前 APAC 的數位分身應用主要集中在智慧城市、製造業與工業物聯網（IIoT），**尚未見到以消費者洞察（Consumer Insights）或市場研究為核心的本土廠商重大公告**。[（來源：Grand View Research）](https://www.grandviewresearch.com/horizon/outlook/digital-twin-market/asia-pacific)\n\n**Bain & Company APAC 消費趨勢報告（2026 年初）**\nBain 報告指出，亞太地區預計於 2035 年超越北美成為全球最大消費市場（規模達 36 兆美元）。目前 APAC 消費者在品牌選擇上最重視「信任」，並大量採用 AI 工具輔助搜尋、比較與購買決策，對合成受訪者研究的需求基礎正在形成。[（來源：Bain & Company）](https://www.bain.com/about/media-center/press-releases/20252/six-trends-to-watch-in-2026-as-asia-pacific-prepares-to-overtake-north-america-as-the-largest-consumer-market-worth-$36-trillion-in-2035/)\n\n**台灣、日本、新加坡、香港：** 本週無數位分身市場研究相關公告，該領域在東亞市場的本土落地案例有待追蹤。\n\n---\n\n## 值得深挖\n\n**1. 大型顧問公司與廣告集團正在「投票」**\nAccenture Ventures（投資 Aaru）、IPG（整合 Aaru 至 Interact）、EY（以 Aaru 一天重現六個月研究）——這三個指標說明主流企業已不再只是試點，而是開始系統性採購合成研究能力。**建議追蹤：** 麥肯錫、BCG、WPP 是否跟進類似動作。\n\n**2. 驗證框架（Validation Framework）正在成為競爭要素**\nPanoplai 率先發布業界驗證白皮書，顯示「合成資料可信度」將是下一個決策痛點。對市調顧問而言，能夠向客戶說明合成受訪者的驗證方法，將成為差異化能力。**建議行動：** 下載 Panoplai 白皮書，建立內部評估標準。\n\n**3. Vurvey Labs「群體互動模擬」填補既有缺口**\n現有多數平台模擬的是靜態個人反應，Populations 2.0 強調模擬群體間的動態影響（如：意見擴散、社會壓力效應）。這對台灣企業研究社群媒體傳播、口碑行銷尤其相關。**建議追蹤：** Vurvey Labs 是否有亞洲企業客戶案例。\n\n**4. 合成資料市場將在 2027 年前突破 5 成比例**\n分析師預測合成資料佔市調輸入的比例將於 2027 年超過 50%——這意味著現在建立操作能力，比等待標準成熟後才導入，可爭取到至少 12–18 個月的先行優勢。\n\n---\n\n*本報告由自動化 Agent 生成｜來源已於各段落標注*"

    "date": "2026-06-05",
    "content": "# 數位分身（Digital Twin）與合成資料（Synthetic Data）供應商觀察\n\n**報告日期：** 2026 年 6 月 5 日  \n**範圍：** 以合成資料為核心的新舊供應商，特別聚焦消費者數位分身（Consumer Digital Twins）與合成受訪者（Synthetic Respondents）應用於市場研究與策略領域。\n\n---\n\n## 本期摘要（TL;DR）\n\n這個市場已從「有趣的實驗」轉變為資金充裕、正在整合的成熟類別。過去約 12 個月，已揭露的創投（VC）資金超過 **2.5 億美元**，2026 年初即出現三件大型募資：Simile 1 億美元、Aaru 達到 10 億美元估值、Listen Labs 6,900 萬美元。方法論上的核心分歧日趨明顯，值得持續追蹤：**有根基的數位分身（Grounded Twins）**（從真實個人訪談/panel 資料建立）vs **純合成人口（Pure Synthetic Populations）**（由公開與專有資料 AI 生成）。效度（Validity）證據持續改善但仍分歧——這本身已成為行銷戰場（見 Panoplai 2026 年 1 月發布的驗證白皮書）。\n\n---\n\n## 重點供應商\n\n**Aaru** — 純合成人口生成器（Pure Synthetic Population Generator）。從公開與專有資料建立數千個 AI 代理人模擬整體人口，無直接人類合作夥伴。2024 年 3 月成立（Cameron Fink、Ned Koh、John Kessler）。**重大消息：** 由 Redpoint 領投的多層次 A 輪（Series A）達到 **10 億美元估值**（募資逾 5,000 萬美元）。已與 **Accenture（同時為投資方）、EY、IPG** 建立企業合作，定位為預測「未來事件」——產品、行銷活動、市場動向。\n\n**Panoplai** — 企業級洞察平台（Enterprise Insights Platform）（2021 年以 Glimpse 名稱創立）。整合傳統調查與合成調查、資料接入、**數位分身建立（Digital Twin Creation）**、合成資料豐富化、互動分析。提供實用的概念框架：合成資料（Synthetic Data）= 類調查的結構化輸出；數位分身（Digital Twin）= 以真實資料為基礎、可互動對話的族群模擬。**重大消息：** 發布**獨立驗證框架白皮書（2026 年 1 月）**，搶占「如何確認準確性？」的公信力高地。\n\n**Artificial Societies（societies.io）** — YC W25 校友。建立由真實社會行為資料驅動、**300–5,000+ 個相互連結的 AI 人格（AI Personas）**網絡，明確模擬社會影響力。自助式且價格低廉（約每月 40 美元，無限使用，30 秒出結果）。截至 2026 年初聲稱有 **15,000+ 用戶、100,000+ 次模擬**。重要信用指標：研究成果發表於 **British Journal of Psychology**，驗證意見動態複製能力。這是市場最平易近人的一端。\n\n**Vurvey Labs** — 「以人為驅動的 AI（AI Powered by People）」。生成式 AI 平台，結合影音問卷與專有的 **「人物模型（People Model）」**，建立以真實消費者為基礎的 AI 人格（非網路爬蟲）。AI Agent 框架自動化研究→創意→回饋循環。**重大消息：** 入選 **Google 2026 年度重點新創（Google Top Start-up to Watch）**；**Dentsu/Carat 合作（2025 年 7 月）**，將代理工具嵌入 dentsu.Connect 平台。四家中最具代理商通路導向。\n\n---\n\n## 新興 / 相鄰供應商（值得追蹤）\n\n**Simile** — 2026 年最受矚目的案例。史丹佛（Stanford）分拆公司，創辦人為 **Joon Sung Park**（2023 年「生成式 Agent / Smallville」論文作者）。從深度訪談資料建立**高保真數位分身（High-fidelity Digital Twins）**（有根基型）。**2026 年 2 月完成 1 億美元 A 輪（Series A），由 Index Ventures 領投**，Bain Capital Ventures、A* 跟投，Fei-Fei Li 與 Andrej Karpathy 參與。聲稱預測法說會（Earnings Call）分析師問題準確率達 80–85%；客戶包含 CVS Health。市場定位：「取代焦點座談（Focus Groups）」。\n\n**Listen Labs** — 非純合成——利用 AI **大規模主持真實人類訪談**（已超過 100 萬場）。**2026 年 1 月完成 6,900 萬美元 B 輪（Series B）**，Ribbit 領投，Sequoia、Conviction、Pear 跟投。客戶包含 Microsoft、Sweetgreen、Perplexity、Robinhood。是合成陣營的「人在迴路（Human-in-the-Loop）」對照組。\n\n**Fairgen**（特拉維夫）— 利用合成資料「補強」樣本數不足的調查格（Survey Cells）；**2024 年完成 800 萬美元種子輪（Seed）**。推出 **Fairgen Twins**——真實具名受訪者數位分身市集，約 20 分鐘可產出完整研究報告。\n\n**Evidenza** — 專攻 **B2B** 的合成受訪者平台（執行長 CEO、資訊長 CIO、財務長 CFO、行銷長 CMO）——難以接觸、成本昂貴的族群。提供即時質化（Qual）+ 量化（Quant）服務。\n\n**Subconscious.ai**（紐約，2022 年成立）— **因果性（Causal）**市場研究 / 行為模擬。將因果實驗（Causal Experiments）時程從數月縮短至約 3 分鐘；成本從每次 2 萬–12 萬美元降至約 10 美元。\n\n**其他浮現中的供應商：** Synthetic Users、Outset AI、Nexxt、Voxpopme、Expected Parrot、Meaningful、xPolls、CivicSync——加上正在切入的傳統大廠（**Ipsos**、Bain、TRC）。\n\n---\n\n## 對你工作的關鍵訊號\n\n- **分類法仍是熱議焦點。** 有根基的分身（Grounded Twin，真實個人資料）vs 合成消費者（Synthetic Consumer，通用人格）vs 合成資料（Synthetic Data，類調查輸出）。各供應商正在選邊站，直接對應效度主張——與 ESOMAR AI 策略論文及數位分身工作坊框架高度相關。\n- **驗證即定位（Validation as Positioning）。** Panoplai 白皮書與 Simile 準確率宣稱，顯示下一波競爭焦點是「證明」，而非速度/成本。學術效度仍「明顯分歧」（據 2025 年底–2026 年初文獻）——這是你在思想領袖表達中值得保留的重要說明。\n- **資金分配不均。** 約 12 輪已揭露融資 / 約 3.15 億美元（至 2026 年 4 月）：少數超大輪次，大量長尾。據點：倫敦、紐約、新加坡、柏林、班加羅爾。\n- **亞太（APAC）市場空白 = 機會。** 多數消費者分身玩家集中於美國/歐洲/以色列。亞太數位分身新創偏向工業用途（Intangles、Neara、FJ Dynamics）。消費者洞察數位分身在亞太地區相對空白——可作為東京場合的切入角度。\n\n---\n\n## 資料來源\n\n- [Vurvey Labs](https://vurvey.com/) · [新工具發布](https://vurvey.com/resources/vurvey-launches-new-ai-tools-for-consumer-insights-and-market-research-teams) · [Carat/Dentsu 合作](https://www.carat.com/en-us/thoughts-and-views/carat-expands-ai-powered-media-capabilities-forges-partnership-with-vurvey-labs-to-deepen-consumer-insight-and-cultural-relevance-for-brands)\n- [Aaru](https://aaru.com/) · [Accenture 投資（Research Live）](https://www.research-live.com/article/news/accenture-invests-in-synthetic-audience-startup-aaru/id/5136643) · [10 億估值（TechBuzz）](https://www.techbuzz.ai/articles/aaru-hits-1b-valuation-with-multi-tier-series-a-funding)\n- [Panoplai](https://www.panoplai.com/) · [數位分身](https://www.panoplai.com/digital-twins) · [驗證白皮書](https://www.newsfilecorp.com/release/279836/Panoplai-Releases-Independent-White-Paper-Introducing-a-New-Validation-Framework-for-Digital-Twins-and-Synthetic-Data)\n- [Artificial Societies](https://societies.io/) · [Research Live 報導](https://www.research-live.com/article/news/ai-startup-artificial-societies-launches-research-simulation/id/5141643) · [Y Combinator](https://www.ycombinator.com/companies/artificial-societies)\n- [Simile 1 億美元（SiliconANGLE）](https://siliconangle.com/2026/02/12/ai-digital-twin-startup-simile-raises-100m-funding/) · [Index Ventures 觀點](https://www.indexventures.com/perspectives/life-the-universe-and-simile-leading-similes-series-a/)\n- [Listen Labs 6,900 萬美元（VentureBeat）](https://venturebeat.com/technology/listen-labs-raises-usd69m-after-viral-billboard-hiring-stunt-to-scale-ai)\n- [Fairgen](https://www.fairgen.ai/) · [Evidenza](https://www.evidenza.ai/) · [Subconscious.ai](https://subconscious.ai/)\n- 市場背景：[Bain — 合成消費者](https://www.bain.com/insights/synthetic-customers-earn-their-stripes/) · [Greenbook 合成樣本供應商](https://www.greenbook.org/market-research-firms/synthetic-sample-providers)"
  }
]
</script>

<script>
const REPORTS = JSON.parse(document.getElementById("reports-data").textContent);

function renderReport(index) {
  const report = REPORTS[index];
  if (!report) return;

  document.getElementById("content").innerHTML = marked.parse(report.content);

  const isLatest = index === 0;
  document.getElementById("meta-bar").innerHTML = `
    <span class="meta-tag ${isLatest ? "latest" : ""}">${isLatest ? "最新報告" : "第 " + (REPORTS.length - index) + " 期"}</span>
    <span class="meta-tag">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      ${report.date}
    </span>
    <span class="meta-tag">共 ${REPORTS.length} 期報告</span>
  `;

  document.querySelectorAll(".report-list a").forEach((a, i) => {
    a.classList.toggle("active", i === index);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function buildSidebar() {
  document.getElementById("report-list").innerHTML = REPORTS.map((r, i) => `
    <li>
      <a href="#" onclick="renderReport(${i}); return false;" class="${i === 0 ? "active" : ""}">
        <span class="r-date">${r.date}</span>
        <span class="r-label">${i === 0 ? "最新" : "第 " + (REPORTS.length - i) + " 期"}</span>
      </a>
    </li>
  `).join("");
}

function updateHeader() {
  document.getElementById("header-count").textContent = `共 ${REPORTS.length} 期`;
  document.getElementById("header-latest").textContent = `最新：${REPORTS[0].date}`;
}

buildSidebar();
updateHeader();
renderReport(0);
</script>
</body>
</html>
